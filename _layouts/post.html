---
layout: default
---
<article class="post">
    {% if page.image %}
    <img class="post-hero" src="{{ page.image }}" alt="{{ page.image_alt | default: page.title }}">
    {% endif %}

    <h1>{{ page.title }}</h1>

    <div class="post-meta">
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
        {% if page.tags and page.tags.size > 0 %}
        <span class="post-tags">
            {% for tag in page.tags %}
            <a class="tag-chip" href="{{ site.baseurl }}/tags/{{ tag | slugify }}/">{{ tag }}</a>
            {% endfor %}
        </span>
        {% endif %}
    </div>

    <div class="post-content">
        {{ content }}
    </div>
</article>
